name: 🚀 CI/CD - Framework Automation

on:
  pull_request:
    branches: [ dev, main ]

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1  # No descargar navegadores en CI básico

jobs:
  # ================================
  # JOB 1: Verificación de Código
  # ================================
  code-quality:
    name: 📝 Code Quality & Compilation
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ['16.x', '18.x', '20.x']
    
    steps:
      # Checkout del código
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4
        
      # Setup Node.js
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      # Cache de dependencias para velocidad
      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            
      # Instalar dependencias
      - name: 📥 Install Dependencies
        run: npm ci
        
      # Verificar formato de código
      - name: 💅 Check Code Formatting
        run: npm run format -- --check
        continue-on-error: false
        
      # Linting
      - name: 🧹 Run ESLint
        run: npm run lint
        
      # Compilación TypeScript
      - name: 🔨 Compile TypeScript
        run: npm run build
        
      # Verificar que no hay errores de tipos
      - name: 🔍 Type Check
        run: npx tsc --noEmit --skipLibCheck
        
      # Subir artefactos de compilación
      - name: 📤 Upload Build Artifacts
        if: matrix.node-version == '18.x'
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # ================================
  # JOB 2: Tests de Framework Core
  # ================================
  core-tests:
    name: 🧪 Core Framework Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📥 Install Dependencies
        run: npm ci
        
      # Instalar navegadores para tests básicos
      - name: 🎭 Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        
      # Ejecutar tests de smoke (solo verificar que el framework funciona)
      - name: 🔥 Run Smoke Tests
        run: |
          # Crear configuración mínima para tests
          echo "BASE_URL=https://example.com" > .env
          echo "CLIENT_A_USERNAME=test" >> .env
          echo "CLIENT_A_PASSWORD=test" >> .env
          
          # Ejecutar tests básicos (solo verificar compilación)
          npx playwright test --config=src/clients/client-a/config/client-a.config.ts --reporter=list || true
        env:
          CI: true

  # ================================
  # JOB 3: Security & Dependencies
  # ================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📥 Install Dependencies
        run: npm ci
        
      # Auditoría de seguridad
      - name: 🛡️ Run Security Audit
        run: npm audit --audit-level=moderate
        
      # Verificar dependencias obsoletas
      - name: 📊 Check Outdated Dependencies
        run: npm outdated || true
        
      # Verificar licencias de dependencias
      - name: 📄 License Check
        run: npx license-checker --summary || true

  # ================================
  # JOB 4: Matrix Testing (Opcional)
  # ================================
  matrix-testing:
    name: 🎯 Multi-Platform Testing
    runs-on: ${{ matrix.os }}
    needs: code-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['18.x']
        
    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: 📥 Install Dependencies
        run: npm ci
        
      - name: 🔨 Build Project
        run: npm run build
        
      - name: ✅ Verify Framework Structure
        shell: bash
        run: |
          # Verificar que los archivos core existen
          test -f "dist/core/config/Config.js" || exit 1
          test -f "dist/core/base/BasePage.js" || exit 1
          test -f "dist/core/utils/Logger.js" || exit 1
          echo "✅ Framework structure verified on ${{ matrix.os }}"

  # ================================
  # JOB 5: Reporte Final
  # ================================
  build-summary:
    name: 📋 Build Summary
    runs-on: ubuntu-latest
    needs: [code-quality, core-tests, security-audit]
    if: always()
    
    steps:
      - name: 📊 Report Build Status
        run: |
          echo "## 🚀 Framework Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core Tests | ${{ needs.core-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.code-quality.result }}" == "success" && "${{ needs.core-tests.result }}" == "success" ]]; then
            echo "🎉 **Framework is ready for deployment!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some checks failed. Please review before merging.**" >> $GITHUB_STEP_SUMMARY
          fi

  # ================================
  # JOB 6: Auto-Documentation
  # ================================
  update-docs:
    name: 📚 Update Documentation
    runs-on: ubuntu-latest
    needs: [code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📥 Install Dependencies
        run: npm ci
        
      # Generar documentación automática (si tienes TypeDoc)
      - name: 📖 Generate API Documentation
        run: |
          # Instalar TypeDoc si no está en package.json
          npm install --no-save typedoc
          
          # Generar documentación
          npx typedoc src/core --out docs/api --excludePrivate --excludeInternal
        continue-on-error: true
        
      # Actualizar README con información de build
      - name: 📝 Update README Badge
        run: |
          # Agregar badge de CI status si no existe
          if ! grep -q "CI Status" README.md; then
            sed -i '1i![CI Status](https://github.com/${{ github.repository }}/workflows/🚀%20CI%2FCD%20-%20Framework%20Automation/badge.svg)\n' README.md
          fi
        continue-on-error: true
        
      # Commit cambios si hay alguno
      - name: 💾 Commit Documentation Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "docs: Update auto-generated documentation [skip ci]"
            git push
          fi
        continue-on-error: true